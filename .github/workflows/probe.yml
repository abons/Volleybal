name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Nevobo API
        run: |
          B=https://api.nevobo.nl
          H='Origin: https://abons.github.io'
          A='Accept: application/ld+json'
          hdr() { curl -sS -m 30 -H "$H" -H "$A" -D - -o /dev/null "$1" | grep -iE '^(HTTP|access-control|content-type|content-length)'; }
          echo "### CORS export ics + preflight"; hdr "$B/export/team/CKM1H25/dames/1/programma.ics"
          curl -sS -m 30 -X OPTIONS -H "$H" -H 'Access-Control-Request-Method: GET' -D - -o /dev/null "$B/competitie/teams" | head -20
          echo "### ICS inhoud"; curl -sS -m 30 "$B/export/team/CKM1H25/dames/1/programma.ics" | head -40
          echo "### paginering"
          curl -sS -m 30 -H "$A" "$B/competitie/teams?naam=volley&itemsPerPage=500&page=1" | jq '{total:."hydra:totalItems", n:(."hydra:member"|length), view:."hydra:view"}'
          echo "### naam filter"
          curl -sS -m 30 -H "$A" "$B/competitie/teams?naam=Volley2B" | jq -c '."hydra:member"[0:3][]|{id:."@id",naam,v:.vereniging}'
          echo "### wedstrijden"
          curl -sS -m 30 -H "$A" "$B/competitie/wedstrijden?team=%2Fcompetitie%2Fteams%2Fckm1h25%2Fdames%2F1" | head -c 3500
          echo; echo "### wedstrijden 2"
          curl -sS -m 30 -H "$A" "$B/competitie/wedstrijden?team=/competitie/teams/ckm1h25/dames/1&order[datum]=asc" | jq '."hydra:totalItems"'
          echo "### vereniging"
          curl -sS -m 30 -H "$A" "$B/relatiebeheer/verenigingen/ckm1h25" | head -c 1200
          echo; echo "### docs resources"
          curl -sS -m 30 -H "$A" "$B/docs.jsonld" | jq -r '."hydra:supportedClass"[]|select(."hydra:title"=="Wedstrijd")|."hydra:supportedProperty"[]|."hydra:title"' | tr '\n' ' '
          echo; echo "### total teams size"
          curl -sS -m 60 -H "$A" "$B/competitie/teams?itemsPerPage=1000" | wc -c
