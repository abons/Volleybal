name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Nevobo API
        run: |
          B=https://api.nevobo.nl
          A='Accept: application/ld+json'
          g() { curl -sS -m 60 -H "$A" "$B$1"; }
          for c in pouleindelingen poules wedstrijden; do
            echo "### $c"; g "/competitie/$c" > /tmp/$c.json
            jq -c '{total:."hydra:totalItems", n:(."hydra:member"|length), last:."hydra:view"."hydra:last", search:[."hydra:search"."hydra:mapping"[]?.variable]}' /tmp/$c.json
          done
          echo "### poule voorbeeld"; jq -c '."hydra:member"[0]|{id:."@id",omschrijving,seizoen,afkorting,klasse}' /tmp/poules.json
          echo "### wedstrijd voorbeeld keys"; jq -c '."hydra:member"[0]|keys' /tmp/wedstrijden.json
          echo "### geniusId/wedstrijdnummer"; jq -c '."hydra:member"[0:3][]|{id:."@id",geniusId,wedstrijdnummer,code,datum,tijdstip}' /tmp/wedstrijden.json
          echo "### filters"
          P="/competitie/poules/regio-zuid/competitie-seniorencompetitie-3/regio-zuid-3ad-12"
          for q in "poule=$P" "status=gespeeld" "datum%5Bbefore%5D=2026-10-04" "poule=$P&status=gespeeld"; do
            echo "-- wedstrijden?$q"; g "/competitie/wedstrijden?$q" | jq -c '{total:."hydra:totalItems", n:(."hydra:member"|length)}'
          done
          echo "-- pouleindelingen?poule&itemsPerPage"; g "/competitie/pouleindelingen?poule=$P" | jq -c '{total:."hydra:totalItems", teams:[."hydra:member"[]|{p:.positie,o:.omschrijving,gs:.gespeeld,pt:.punten,w:.wedstrijdenWinst,v:.wedstrijdenVerlies,sv:.setsVoor,st:.setsTegen}]}'
          echo "-- poule detail"; g "$P" | jq -c '{omschrijving,afkorting}'
          echo "### team met meer wedstrijden: aantal wedstrijden per team ckm1h25/dames/1 totaal"; g "/competitie/wedstrijden?team=%2Fcompetitie%2Fteams%2Fckm1h25%2Fdames%2F1" | jq -c '."hydra:totalItems"'
          echo "### speelschema ics bevat gespeelde?"; curl -sS -m 30 "$B/export/team/CKM1H25/dames/1/programma.ics" | grep -c BEGIN:VEVENT
          echo "### resultaten.rss"; curl -sS -m 30 "$B/export/team/CKM1H25/dames/1/resultaten.rss" | head -c 1500
